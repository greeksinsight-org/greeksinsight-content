<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: "GreeksInsight" }}</title>

  <!-- 🔥 Favicon -->
  <link rel="icon" type="image/png" href="{{ '/assets/images/gi_transparent_3D_2.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/gi_transparent_3D_2.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/images/gi_transparent_3D_2.png' | relative_url }}">

  <!-- Google Font + Neon Theme -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  <!-- ✨ Dancing Greek Letters Background -->
  <div class="greek-bg">
    <span class="glitch brandPurple">Γ Δ Θ</span>
    <span class="glitch brandPurple">Δ Γ Θ</span>
    <span class="glitch brandPurple">Δ Θ Γ</span>
    <span class="glitch brandPurple">Θ Δ Γ</span>
  </div>

  <!-- 🔮 Neon Brand Logo -->
  <div class="brandName">
    <img 
      src="{{ '/assets/images/gi_transparent_3D_2.png' | relative_url }}" 
      alt="GreeksInsight Logo" 
      class="brand-logo"
    />
    <span class="glitch brandPurple">GreeksInsight</span>
  </div>

  <!-- 🔹 Header with Rounded Neon Nav -->
  <header>
    <nav>
      <a href="/{{ page.lang }}/">Home</a>
      <a href="/knowledge/{{ page.lang }}/">Knowledge Base</a>
      <a href="/howto/{{ page.lang }}/">Howto</a>
      <!-- <a href="/about/{{ page.lang }}/">About</a> -->
    </nav>

    <div class="lang-toggle" id="langToggle">
      <span id="enBtn" class="{% if page.lang == 'en' %}active{% endif %}">EN</span>
      <span id="esBtn" class="{% if page.lang == 'es' %}active{% endif %}">ES</span>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    © {{ site.time | date: "%Y" }} GreeksInsight
  </footer>

  <script src="{{ '/assets/js/lang-toggle.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/nav-active.js' | relative_url }}"></script>
</body>
</html>
